<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Export JSON - Morning Brief</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: #f8fafc;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #1d4ed8;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    button.green {
      background: #16a34a;
    }
    button.green:hover:not(:disabled) {
      background: #15803d;
    }
    .status {
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 10px;
    }
    .status.success {
      background: #1c2d1e;
      color: #4ade80;
      border: 1px solid #22c55e;
    }
    .status.error {
      background: #2d1f1f;
      color: #f87171;
      border: 1px solid #ef4444;
    }
    .json-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .json-viewer {
      background: #0f172a;
      color: #e2e8f0;
      padding: 15px;
      border-radius: 6px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      overflow: auto;
      max-height: 700px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #1e293b;
    }
    .copy-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: #15803d;
    }
    .copy-feedback {
      display: inline-block;
      color: #4ade80;
      font-weight: 600;
      margin-left: 10px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .copy-feedback.show {
      opacity: 1;
    }
    .info {
      background: #1c2d1e;
      color: #86efac;
      padding: 15px;
      border-radius: 6px;
      border-left: 4px solid #22c55e;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Export Morning Brief as JSON</h1>
    <p class="subtitle">Copy the raw JSON data to paste into ChatGPT</p>
    
    <div class="info">
      Click "Fetch JSON" to get your latest email and calendar data, then "Copy to Clipboard" to paste into ChatGPT for analysis.
    </div>
    
    <div class="toolbar">
      <button id="fetchBtn">📊 Fetch JSON</button>
      <button id="copyBtn" class="green" disabled>📋 Copy to Clipboard</button>
      <span id="feedback" class="copy-feedback">✓ Copied!</span>
    </div>
    
    <div id="status"></div>
    
    <div class="json-container">
      <div class="json-viewer" id="jsonView">Ready to fetch data...</div>
    </div>
  </div>

  <script>
    const BASE = 'https://morning-brief-connector.reinier-olivier.workers.dev';
    const TOKEN = '716180e24c87de8b699efd32198adbd9';
    
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      try {
        document.getElementById('fetchBtn').disabled = true;
        document.getElementById('status').innerHTML = '';
        
        const resp = await fetch(BASE + '/brief', {
          headers: { Authorization: 'Bearer ' + TOKEN }
        });
        
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        
        const data = await resp.json();
        
        // Display JSON
        document.getElementById('jsonView').textContent = JSON.stringify(data, null, 2);
        document.getElementById('copyBtn').disabled = false;
        document.getElementById('status').innerHTML = '<div class="status success">✓ Data loaded successfully!</div>';
        
      } catch (err) {
        document.getElementById('status').innerHTML = '<div class="status error">✗ Error: ' + err.message + '</div>';
      } finally {
        document.getElementById('fetchBtn').disabled = false;
      }
    });
    
    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        const text = document.getElementById('jsonView').textContent;
        await navigator.clipboard.writeText(text);
        
        const feedback = document.getElementById('feedback');
        feedback.classList.add('show');
        setTimeout(() => {
          feedback.classList.remove('show');
        }, 2000);
      } catch (err) {
        document.getElementById('status').innerHTML = '<div class="status error">✗ Copy failed: ' + err.message + '</div>';
      }
    });
    
    // Try to load on page load if token is available
    if (TOKEN) {
      document.getElementById('fetchBtn').click();
    }
  </script>
</body>
</html>
