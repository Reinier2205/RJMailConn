<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Intelligence Brief</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status-complete {
            background: #d4edda;
            color: #155724;
        }

        .status-partial {
            background: #fff3cd;
            color: #856404;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }

        .warning-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #856404;
        }

        .email-item, .event-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.2s ease;
        }

        .email-item:hover, .event-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .email-subject {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .email-sender {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .email-preview {
            color: #888;
            font-size: 0.9em;
            font-style: italic;
            margin-top: 8px;
        }

        .email-time {
            color: #999;
            font-size: 0.85em;
        }

        .event-title {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .event-time {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .event-location {
            color: #666;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '...';
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }

        .meta-info {
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
            text-align: center;
        }

        .importance-high {
            border-left-color: #dc3545;
        }

        .importance-normal {
            border-left-color: #667eea;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌅 Morning Intelligence Brief</h1>
            <p>Your personalized email and calendar overview</p>
        </div>

        <div class="controls">
            <button id="refreshBtn" class="btn">🔄 Load Morning Brief</button>
        </div>

        <div id="loading" class="section loading" style="display: none;">
            Loading your morning brief
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="briefContent" style="display: none;">
            <!-- Status Overview -->
            <div class="section">
                <h2>📊 Status Overview</h2>
                <div id="statusBadge"></div>
                <div id="warnings"></div>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="unreadCount">0</div>
                        <div class="stat-label">Unread Emails</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="todayEventsCount">0</div>
                        <div class="stat-label">Events Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="upcomingEventsCount">0</div>
                        <div class="stat-label">Upcoming Events</div>
                    </div>
                </div>
                <div class="meta-info">
                    Generated at: <span id="generatedAt"></span>
                </div>
            </div>

            <!-- New Emails -->
            <div class="section">
                <h2>📬 New Emails</h2>
                <div id="newEmails"></div>
            </div>

            <!-- Important Emails -->
            <div class="section">
                <h2>⭐ Important Emails</h2>
                <div id="importantEmails"></div>
            </div>

            <!-- Today's Events -->
            <div class="section">
                <h2>📅 Today's Events</h2>
                <div id="todayEvents"></div>
            </div>

            <!-- Upcoming Events -->
            <div class="section">
                <h2>🗓️ Upcoming Events (Next 7 Days)</h2>
                <div id="upcomingEvents"></div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            apiEndpoint: 'https://morning-brief-connector.reinier-olivier.workers.dev/brief',
            // Get this from your Cloudflare secrets - CONNECTOR_API_TOKEN
            // For security, in production you should prompt for this or store securely
            apiToken: prompt('Enter your API token (CONNECTOR_API_TOKEN):')
        };

        // Load morning brief
        async function loadMorningBrief() {
            if (!CONFIG.apiToken) {
                showError('API token is required. Please refresh and enter your token.');
                return;
            }

            hideError();
            showLoading();

            try {
                const response = await fetch(CONFIG.apiEndpoint, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiToken}`
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to fetch morning brief');
                }

                const brief = await response.json();
                displayBrief(brief);
            } catch (error) {
                showError('Failed to load morning brief: ' + error.message);
            }
        }

        // Display the brief
        function displayBrief(brief) {
            hideLoading();
            document.getElementById('briefContent').style.display = 'block';

            // Status badge
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.className = `status-badge status-${brief.status}`;
            statusBadge.textContent = `Sync Status: ${brief.status}`;

            // Warnings
            const warningsDiv = document.getElementById('warnings');
            if (brief.warnings && brief.warnings.length > 0) {
                warningsDiv.innerHTML = brief.warnings.map(w => `
                    <div class="warning">
                        <div class="warning-title">⚠️ Warning</div>
                        ${w}
                    </div>
                `).join('');
            } else {
                warningsDiv.innerHTML = '';
            }

            // Stats
            document.getElementById('unreadCount').textContent = brief.emails.unread_count || 0;
            document.getElementById('todayEventsCount').textContent = brief.calendar.today_events.length;
            document.getElementById('upcomingEventsCount').textContent = brief.calendar.upcoming_events.length;
            document.getElementById('generatedAt').textContent = new Date(brief.generated_at).toLocaleString();

            // New emails
            displayEmails('newEmails', brief.emails.new_messages);

            // Important emails
            displayEmails('importantEmails', brief.emails.important_messages);

            // Today's events
            displayEvents('todayEvents', brief.calendar.today_events);

            // Upcoming events
            displayEvents('upcomingEvents', brief.calendar.upcoming_events);
        }

        function displayEmails(containerId, emails) {
            const container = document.getElementById(containerId);
            if (!emails || emails.length === 0) {
                container.innerHTML = '<div class="empty-state">No emails in this category</div>';
                return;
            }

            container.innerHTML = emails.map(email => `
                <div class="email-item importance-${email.importance}">
                    <div class="email-subject">${escapeHtml(email.subject)}</div>
                    <div class="email-sender">From: ${escapeHtml(email.sender_name || email.sender_email)}</div>
                    <div class="email-time">${new Date(email.received_at).toLocaleString()}</div>
                    ${email.body_preview ? `<div class="email-preview">${escapeHtml(email.body_preview)}</div>` : ''}
                </div>
            `).join('');
        }

        function displayEvents(containerId, events) {
            const container = document.getElementById(containerId);
            if (!events || events.length === 0) {
                container.innerHTML = '<div class="empty-state">No events in this period</div>';
                return;
            }

            container.innerHTML = events.map(event => `
                <div class="event-item">
                    <div class="event-title">${escapeHtml(event.subject)}</div>
                    <div class="event-time">
                        ${new Date(event.start_at).toLocaleString()} - ${new Date(event.end_at).toLocaleTimeString()}
                    </div>
                    ${event.location ? `<div class="event-location">📍 ${escapeHtml(event.location)}</div>` : ''}
                    ${event.organiser ? `<div class="event-location">Organized by: ${escapeHtml(event.organiser)}</div>` : ''}
                </div>
            `).join('');
        }

        // UI helpers
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('briefContent').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            hideLoading();
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('refreshBtn').addEventListener('click', loadMorningBrief);

        // Auto-load if token is provided
        if (CONFIG.apiToken) {
            loadMorningBrief();
        }
    </script>
</body>
</html>
