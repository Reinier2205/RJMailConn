<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Morning Brief - Sync & Copy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { margin: 0 0 10px 0; color: #1f2937; }
    p { color: #6b7280; margin: 0 0 20px 0; }
    
    .section { margin: 30px 0; }
    .section-title { font-weight: bold; font-size: 16px; margin-bottom: 12px; color: #1f2937; }
    
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #2563eb; }
    button:disabled { background: #d1d5db; cursor: not-allowed; }
    
    button.green {
      background: #10b981;
    }
    button.green:hover:not(:disabled) { background: #059669; }
    
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .status.error {
      background: #fee2e2;
      color: #7f1d1d;
      border: 1px solid #fecaca;
    }
    
    .json-box {
      background: #1f2937;
      color: #e5e7eb;
      padding: 15px;
      border-radius: 6px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      overflow: auto;
      max-height: 600px;
      margin-top: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .copy-feedback {
      color: #10b981;
      font-weight: bold;
      font-size: 14px;
      margin-left: 10px;
      display: none;
    }
    .copy-feedback.show { display: inline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Morning Brief Sync</h1>
    <p>Sync your email and calendar data for ChatGPT</p>
    
    <div class="section">
      <div class="section-title">1. Sync Data</div>
      <button id="syncBtn">Sync & Refresh</button>
      <div id="syncStatus"></div>
    </div>
    
    <div class="section">
      <div class="section-title">2. Copy JSON</div>
      <button id="copyBtn" class="green" disabled>Copy to Clipboard</button>
      <span id="copyFeedback" class="copy-feedback">✓ Copied!</span>
      <div id="jsonBox" class="json-box">Ready to sync</div>
    </div>
  </div>

  <script>
    const BASE = 'https://morning-brief-connector.reinier-olivier.workers.dev';
    
    let state = JSON.parse(localStorage.getItem('oauthState') || '{}');
    
    function saveState() {
      localStorage.setItem('oauthState', JSON.stringify(state));
    }
    
    document.getElementById('syncBtn').addEventListener('click', async () => {
      try {
        if (!state.accessToken) {
          document.getElementById('syncStatus').innerHTML = '<div class="status error">No access token. Need to authorize first.</div>';
          return;
        }
        
        document.getElementById('syncBtn').disabled = true;
        document.getElementById('syncStatus').innerHTML = '';
        
        const resp = await fetch(BASE + '/mcp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + state.accessToken
          },
          body: JSON.stringify({
            jsonrpc: '2.0',
            method: 'tools/call',
            params: { name: 'get_morning_brief', arguments: {} },
            id: 1
          })
        });
        
        const data = await resp.json();
        document.getElementById('syncBtn').disabled = false;
        
        if (resp.ok && data.result) {
          const briefText = data.result.content[0].text;
          const briefJson = JSON.parse(briefText);
          document.getElementById('jsonBox').textContent = JSON.stringify(briefJson, null, 2);
          document.getElementById('copyBtn').disabled = false;
          document.getElementById('syncStatus').innerHTML = '<div class="status success">✓ Synced successfully!</div>';
        } else {
          document.getElementById('syncStatus').innerHTML = '<div class="status error">Sync failed: ' + (data.error ? data.error.message : 'Unknown error') + '</div>';
        }
      } catch (err) {
        document.getElementById('syncBtn').disabled = false;
        document.getElementById('syncStatus').innerHTML = '<div class="status error">Error: ' + err.message + '</div>';
      }
    });
    
    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        const text = document.getElementById('jsonBox').textContent;
        await navigator.clipboard.writeText(text);
        document.getElementById('copyFeedback').classList.add('show');
        setTimeout(() => {
          document.getElementById('copyFeedback').classList.remove('show');
        }, 2000);
      } catch (err) {
        alert('Copy failed: ' + err.message);
      }
    });
    
    // Check for auth code callback
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const returnedState = params.get('state');
    
    if (code && returnedState === state.authState) {
      state.authorizationCode = code;
      saveState();
      window.history.replaceState({}, '', window.location.pathname);
      alert('Authorization code received! Click "Exchange Token" to proceed.');
    }
    
    // Enable copy button if token exists
    if (state.accessToken) {
      document.getElementById('copyBtn').disabled = false;
    }
  </script>
</body>
</html>
