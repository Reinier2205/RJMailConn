# Cloudflare Workers Configuration for Microsoft 365 Mail Connector
# Copy this file to wrangler.toml and update with your specific values

name = "microsoft-365-mail-connector"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Main entry point
main = "src/index.ts"

# D1 Database bindings
[[d1_databases]]
binding = "DB"
database_name = "mail-connector-db"
database_id = "your-database-id-here"
migrations_dir = "migrations"

# Environment variables and secrets (configure via CLI)
[vars]
# Non-sensitive configuration
LOG_LEVEL = "info"
API_VERSION = "v1"

# Secrets to be configured via wrangler secret put
# These are referenced in code but values set via CLI:
# wrangler secret put MICROSOFT_CLIENT_ID
# wrangler secret put MICROSOFT_CLIENT_SECRET  
# wrangler secret put CONNECTOR_API_TOKEN

# Cron triggers for scheduled synchronization
[[triggers.crons]]
cron = "*/15 * * * *"  # Every 15 minutes, adjust as needed

# KV namespaces for session storage (if needed)
[[kv_namespaces]]
binding = "SESSIONS"
id = "your-sessions-namespace-id"
preview_id = "your-preview-sessions-namespace-id"

# Build configuration
[build]
command = "npm run build"

# Development configuration
[dev]
port = 8787
local_protocol = "http"